{% extends "base.html" %}
{% block title %}Choose a new password · Library{% endblock %}
{% block content %}
  <section class="auth-card">
    <h1>Choose a new password</h1>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="password">New password</label>
      <input id="password" name="password" type="password" minlength="{{ min_length }}" maxlength="128" autocomplete="new-password" required autofocus>
      <p class="hint">At least {{ min_length }} characters.</p>
      <label for="confirm_password">Confirm new password</label>
      <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" required>
      <button type="submit">Update password</button>
    </form>
  </section>
{% endblock %}
