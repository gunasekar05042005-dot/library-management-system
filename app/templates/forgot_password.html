{% extends "base.html" %}
{% block title %}Reset password · Library{% endblock %}
{% block content %}
  <section class="auth-card">
    <h1>Reset your password</h1>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required autofocus>
      <button type="submit">Send reset link</button>
    </form>
    {% if link %}
      <p class="notice demo">Demo mode: no email server is configured, so the link is shown here instead of being emailed.<br><a href="{{ link }}">Open the reset link</a></p>
    {% endif %}
    <p class="alt"><a href="{{ url_for('auth.login') }}">Back to log in</a></p>
  </section>
{% endblock %}
